<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" font-family="Noto Serif SC, serif" font-size="14">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A2332" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#D4A843"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#B8860B" opacity="0.7"/>
    </marker>
  </defs>

  <rect width="720" height="200" fill="#FAF7F2" rx="12"/>

  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1A2332">自然务实 · 三步操作法</text>
  <line x1="280" y1="36" x2="440" y2="36" stroke="#B8860B" stroke-width="2"/>

  <!-- Step 1: 抓核心 -->
  <rect x="20" y="52" width="200" height="48" rx="10" fill="#FFF8EE" stroke="url(#goldGrad)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="120" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#1A2332">第一步 抓核心</text>
  <text x="120" y="92" text-anchor="middle" font-size="11" fill="#6B6560">这件事最重要的一点是什么？</text>

  <!-- Step 2: 去行动 -->
  <rect x="260" y="52" width="200" height="48" rx="10" fill="#FFF8EE" stroke="url(#goldGrad)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="360" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#1A2332">第二步 去行动</text>
  <text x="360" y="92" text-anchor="middle" font-size="11" fill="#6B6560">不要求完美，先做起来</text>

  <!-- Step 3: 复盘 -->
  <rect x="500" y="52" width="200" height="48" rx="10" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">第三步 复盘</text>
  <text x="600" y="92" text-anchor="middle" font-size="11" fill="#FFF8EE">做了以后回头看：核心抓对了吗？</text>

  <!-- Arrows -->
  <line x1="220" y1="76" x2="256" y2="76" stroke="#B8860B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="76" x2="496" y2="76" stroke="#B8860B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bottom insight -->
  <rect x="20" y="118" width="680" height="68" rx="10" fill="#1A2332" opacity="0.06" stroke="#E0D6C8"/>
  <text x="360" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#1A2332">核心洞察</text>
  <text x="360" y="158" text-anchor="middle" font-size="11" fill="#6B6560">直指人心，一句话说清楚 → 不追求完美方案，行动中调整</text>
  <text x="360" y="174" text-anchor="middle" font-size="11" fill="#B8860B" font-weight="600">复盘不是为了苛责自己，是为了下次更准</text>
</svg>